<div class="min-h-screen bg-fond md:flex">
  <!-- Barre latérale -->
  <aside
    class="md:sticky md:top-0 md:h-screen md:w-64 md:shrink-0 border-b border-bordure/70 md:border-b-0 md:border-r bg-surface-2/60 backdrop-blur"
  >
    <div class="flex items-center justify-between p-4">
      <a routerLink="/admin" class="flex items-center gap-2">
        <span class="rounded-lg bg-cyan px-2 py-1 font-display text-sm font-bold text-fond"
          >SSI</span
        >
        <span class="font-corps text-sm font-semibold">Back-office</span>
      </a>
      <button
        type="button"
        (click)="menuOuvert.set(!menuOuvert())"
        class="rounded-lg border border-bordure px-3 py-1 font-corps text-sm md:hidden"
      >
        Menu
      </button>
    </div>

    <nav class="px-3 pb-4" [class.hidden]="!menuOuvert()" [class.md:block]="true">
      <ul class="space-y-1">
        @for (lien of liens; track lien.chemin) {
          <li>
            <a
              [routerLink]="lien.chemin"
              (click)="menuOuvert.set(false)"
              routerLinkActive="admin-lien-actif"
              [routerLinkActiveOptions]="{ exact: lien.chemin === '/admin' }"
              class="admin-lien"
            >
              <span class="w-5 text-center">{{ lien.icone }}</span>
              {{ lien.libelle }}
            </a>
          </li>
        }
      </ul>

      <div class="mt-6 border-t border-bordure/70 pt-4">
        <a routerLink="/" class="admin-lien"><span class="w-5 text-center">↩</span> Voir le site</a>
        <button type="button" (click)="auth.deconnexion()" class="admin-lien w-full">
          <span class="w-5 text-center">⏻</span> Déconnexion
        </button>
      </div>
    </nav>
  </aside>

  <!-- Contenu -->
  <div class="flex-1">
    <header
      class="flex items-center justify-between border-b border-bordure/70 bg-surface/60 px-6 py-4 backdrop-blur"
    >
      <span class="font-corps text-sm text-encre-attenue"
        >Administration · Sen Solution Informatique</span
      >
      @if (auth.utilisateur(); as u) {
        <span class="admin-badge">{{ u.nom_complet }}</span>
      }
    </header>

    <main class="p-6">
      <router-outlet />
    </main>
  </div>
</div>
