<section class="mx-auto max-w-md px-4 py-16 md:px-6">
  <span class="puce">// Connexion</span>
  <h1 class="mt-4 font-display text-3xl font-bold">Se connecter</h1>
  <p class="mt-2 text-encre-attenue">Accédez à votre espace et à votre historique.</p>

  <div class="mt-8 space-y-5">
    <div>
      <label class="mb-1 block font-mono text-xs uppercase tracking-wide text-encre-attenue"
        >E-mail</label
      >
      <input
        type="email"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        (keyup.enter)="connecter()"
        class="w-full border-2 border-bordure bg-fond px-3 py-2 outline-none focus:border-cyan"
      />
    </div>
    <div>
      <label class="mb-1 block font-mono text-xs uppercase tracking-wide text-encre-attenue"
        >Mot de passe</label
      >
      <div class="relative">
        <input
          [type]="voirMdp() ? 'text' : 'password'"
          [value]="motDePasse()"
          (input)="motDePasse.set($any($event.target).value)"
          (keyup.enter)="connecter()"
          class="w-full border-2 border-bordure bg-fond px-3 py-2 pr-16 outline-none focus:border-cyan"
        />
        <button
          type="button"
          (click)="voirMdp.set(!voirMdp())"
          class="absolute right-2 top-1/2 -translate-y-1/2 font-mono text-xs uppercase tracking-wide text-encre-attenue hover:text-cyan"
        >
          {{ voirMdp() ? 'Cacher' : 'Voir' }}
        </button>
      </div>
    </div>

    @if (erreur()) {
      <p class="border-2 border-orange bg-surface p-3 font-mono text-sm text-orange">
        {{ erreur() }}
      </p>
    }

    <button
      type="button"
      (click)="connecter()"
      [disabled]="envoi()"
      class="bouton-primaire w-full justify-center disabled:opacity-50"
    >
      {{ envoi() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </div>

  <p class="mt-6 text-sm text-encre-attenue">
    Pas encore de compte ?
    <a routerLink="/inscription" class="text-cyan underline">Créer un compte</a>
  </p>
</section>
